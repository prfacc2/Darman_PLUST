<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- v1.70.0: declare this page's identity to the shared shell runtime
       (common.js). Drives verb namespacing + the page arg passed to azCall. -->
  <meta name="az-page" content="crm" />
  <title>مدیریت درمانگاه — درمان پلاس</title>
  <!-- SHARED shell stylesheet FIRST (RTL/Vazirmatn/themes/toasts), then the
       page-specific CRM sheet so the page can still override anything. -->
  <link rel="stylesheet" href="common.css" />
  <link rel="stylesheet" href="crm.css" />
</head>
<body>
  <!-- Full-screen loader until the C++ bridge connects and crm.init completes. -->
  <div id="loader" class="crm-loader">
    <div class="crm-loader-box">
      <div class="crm-loader-spin"></div>
      <div class="crm-loader-text" id="loaderText">در حال بارگذاری پنل مدیریت…</div>
    </div>
  </div>

  <div id="app" class="crm-app" aria-hidden="true">

    <!-- v1.74: the right sidebar menu (crm-nav) is RETIRED. Navigation is now a
         categorized quick-access tile grid rendered on the Dashboard (home) page
         plus a top bar with a global search, backup button and message badge.
         Static element IDs the JS depends on (navMsgBadge, navBackup) are kept. -->
    <!-- ======================= TOP BAR =======================
         v1.77: clean header — hamburger + identity chip (user name + access
         level, one combined element, not three separate items) + global search.
         The decorative brand-logo badge that used to sit next to the hamburger is
         removed. Static element IDs the JS depends on (navHome, navUserName,
         navUserRole, navSearch, navBackup, navMsgBadge) are all preserved. -->
    <header class="crm-topbar">
      <button class="crm-topbar-burger" id="navMenu" title="منو" aria-label="منو">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/></svg>
      </button>
      <button class="crm-topbar-brand" id="navHome" title="خانه">
        <span class="crm-topbar-who">
          <span class="crm-topbar-name" id="navUserName">مدیریت درمانگاه</span>
          <span class="crm-topbar-role" id="navUserRole">—</span>
        </span>
      </button>
      <div class="crm-topbar-search">
        <input class="crm-input" id="navSearch" placeholder="جستجوی دسترسی سریع…" />
        <span class="crm-search-ic"><svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M10 2a8 8 0 105.3 14L20 20.7 21.7 19l-4.7-4.7A8 8 0 0010 2zm0 2a6 6 0 110 12 6 6 0 010-12z"/></svg></span>
      </div>
      <div class="crm-topbar-actions">
        <button type="button" class="crm-topbar-mail" id="navMsgBtn" title="پیام‌های دریافتی">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
          <span class="crm-topbar-badge" id="navMsgBadge" style="display:none">0</span>
        </button>
      </div>
    </header>

    <!-- ======================= HAMBURGER NAV DRAWER =======================
         v1.75: the categorized navigation now lives in a slide-out drawer
         (populated from Crm.categories by crm_menu.js). The body (#crmMenuBody) is
         rebuilt on each open so the active page stays highlighted. -->
    <div class="crm-menu-backdrop" id="crmMenuBackdrop"></div>
    <aside class="crm-menu" id="crmMenu" aria-hidden="true">
      <div class="crm-menu-head">
        <span class="crm-menu-title">منوی مدیریت</span>
        <button class="crm-menu-close" id="crmMenuClose" title="بستن" aria-label="بستن">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>
      <nav class="crm-menu-body" id="crmMenuBody"><!-- categorized nav injected by JS --></nav>
    </aside>

    <!-- ======================= BODY ======================= -->
    <div class="crm-body">

      <!-- ---------------------- MAIN CONTENT ---------------------- -->
      <main class="crm-main" id="crmMain">
        <div class="crm-page" id="crmPage"><!-- pages render here --></div>
      </main>

    </div>
  </div>

  <!-- v1.70.0: SHARED shell runtime FIRST — defines AzBoot/AzBridge/AzUi/AzNav.
       The CRM page uses AzBridge as its single C++<->JS transport (no separate
       bridge.js needed). Page modules register on window.Crm and are routed by
       crm.js. ES5-only so it parses on MSHTML/Trident as well as WebView2. -->
  <script src="common.js"></script>
  <script src="crm.js"></script>
  <script src="crm_menu.js"></script>
  <script src="crm_dialogs.js"></script>
  <script src="dashboard.js"></script>
  <script src="sections.js"></script>
  <script src="patients.js"></script>
  <script src="doctors.js"></script>
  <script src="services.js"></script>
  <!-- v1.79.0: «تعریف پرسنل» (personnel registry) + «تعریف حساب کاربری»
       (accounts.js — the old employees.js «کاربران» page, rebuilt around the
       personnel registry with access ticks and filters) -->
  <script src="persons.js"></script>
  <script src="accounts.js"></script>
  <script src="messages.js"></script>
  <script src="insurance.js"></script>
  <script src="settings.js"></script>
  <script src="calendar.js"></script>
  <script src="backup.js"></script>
</body>
</html>
